name: Build and test desktop apps
on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare snowfall, desktop polling and gift history with version 3.3
        shell: powershell
        run: |
          git archive v3.3.0 --format=zip --output=baseline.zip src Build.ps1
          if ($LASTEXITCODE) { throw 'Cannot read the 3.3 baseline.' }
          Expand-Archive baseline.zip .\baseline
          Write-Host 'Jake Frost 3.3'
          .\tests\WindowsPerformance.ps1 -SourceDirectory .\baseline\src
          Write-Host 'Current release candidate'
          .\tests\WindowsPerformance.ps1
      - name: Build the Windows app and per-user installer
        shell: powershell
        run: |
          .\Build.ps1 -OutputDirectory .\dist\Jake-Frost
          .\BuildSetup.ps1 -AppDirectory .\dist\Jake-Frost -OutputDirectory .\dist\public
          Compress-Archive -LiteralPath .\dist\Jake-Frost -DestinationPath .\dist\public\Jake-Frost-Windows.zip
      - name: Measure time until the settings panel and snow overlay are responsive
        shell: powershell
        run: |
          .\baseline\Build.ps1 -OutputDirectory .\dist\baseline
          .\tests\WindowsStartup.ps1 -BaselineApplication .\dist\baseline\JakeFrost.exe -Application .\dist\Jake-Frost\JakeFrost.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-downloads
          path: dist/public/
          if-no-files-found: error
      - name: Send a tree from the Windows release
        shell: powershell
        run: .\tests\ExportWindowsGift.ps1 -AppDirectory .\dist\Jake-Frost -OutputPath .\dist\gifts\windows-tree.fpgift
      - name: Send an addressed tree through a Windows shared folder
        shell: powershell
        run: .\tests\WindowsSharedGifts.ps1 -Mode Send -AppDirectory .\dist\Jake-Frost -ProfileDirectory .\dist\windows-shared\profile -ShareDirectory .\dist\windows-shared\share
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-shared-gifts
          path: dist/windows-shared/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-gift
          path: dist/gifts/windows-tree.fpgift
          if-no-files-found: error

  mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Measure heavy snowfall against version 3.3
        run: bash macOS/Tests/benchmark-snow.sh v3.3.0
      - name: Build and test the universal Mac app
        run: bash macOS/build.sh "$RUNNER_TEMP/JakeBuild"
      - name: Exchange portable gifts
        run: |
          mkdir -p dist
          swiftc -swift-version 5 macOS/Sources/FrostGift.swift macOS/Tests/CodecProbe.swift -o "$RUNNER_TEMP/check-gifts"
          "$RUNNER_TEMP/check-gifts" macOS/Tests/Fixtures/windows-tree.fpgift dist/mac-tree.fpgift
      - name: Check shared-folder contacts and delivery on Apple Silicon
        run: bash macOS/test-shared.sh
      - name: Make the drag-to-Applications disk image
        run: |
          mkdir "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/JakeBuild/Jake Frost.app" "$RUNNER_TEMP/dmg/Jake Frost.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Jake Frost" -srcfolder "$RUNNER_TEMP/dmg" -format UDZO dist/Jake-Frost-Mac.dmg
          hdiutil verify dist/Jake-Frost-Mac.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-download
          path: dist/Jake-Frost-Mac.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-gift
          path: dist/mac-tree.fpgift
          if-no-files-found: error

  intel-mac:
    needs: [mac, windows]
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-download
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-gift
          path: dist/gifts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-gift
          path: dist/gifts
      - name: Open the shipped disk image and run its Intel app
        run: |
          mount="$RUNNER_TEMP/frostmount"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" dist/Jake-Frost-Mac.dmg
          trap 'hdiutil detach "$mount"' EXIT
          test "$(readlink "$mount/Applications")" = /Applications
          mkdir -p "$HOME/Applications"
          app="$HOME/Applications/Jake Frost.app"
          ditto "$mount/Jake Frost.app" "$app"
          hdiutil detach "$mount"
          trap - EXIT
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/JakeFrost" -verify_arch arm64 x86_64
          "$app/Contents/MacOS/JakeFrost" --scene-self-test
          "$app/Contents/MacOS/JakeFrost" --app-smoke-test
          bash macOS/test-open.sh "$app" dist/gifts/mac-tree.fpgift dist/gifts/windows-tree.fpgift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-shared-gifts
          path: dist/windows-shared
      - name: Receive the Windows tree and send an addressed Mac snowman
        run: bash macOS/test-shared.sh dist/windows-shared/share dist/mac-shared
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-shared-gifts
          path: dist/mac-shared/
          if-no-files-found: error

  verify-windows:
    needs: [windows, mac, intel-mac]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-downloads
          path: dist/public
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-gift
          path: dist/gifts
      - name: Install, open the Mac gift, upgrade and uninstall
        shell: powershell
        run: |
          Expand-Archive .\dist\public\Jake-Frost-Windows.zip .\dist
          .\tests\WindowsSetup.ps1 -SetupPath .\dist\public\Jake-Frost-Setup.exe -AppDirectory .\dist\Jake-Frost -GiftPath .\dist\gifts\mac-tree.fpgift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-shared-gifts
          path: dist/windows-shared
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-shared-gifts
          path: dist/mac-shared
      - name: Receive Intel Mac's shared-folder snowman with the original Windows identity
        shell: powershell
        run: .\tests\WindowsSharedGifts.ps1 -Mode Receive -AppDirectory .\dist\Jake-Frost -ProfileDirectory .\dist\windows-shared\profile -ShareDirectory .\dist\mac-shared
